model:
  name_or_path: Qwen/Qwen3-8B-Base
  revision: main
  trust_remote_code: false

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

smoke:
  seed: 42
  learning_rate: 1.0e-4
  max_input_tokens: 128
  prompt: "Medical QLoRA phase-zero smoke test."

