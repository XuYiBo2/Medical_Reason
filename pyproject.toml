[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medreason-rlvr"
version = "0.1.0"
description = "Offline difficulty-aware GRPO experiments for medical reasoning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "numpy",
    "pandas",
    "peft",
    "pyyaml",
    "safetensors",
    "scipy",
    "torch",
    "transformers",
    "trl==1.10.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/medreason"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

