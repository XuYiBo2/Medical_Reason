seed: 42

datasets:
  medmcqa:
    id: openlifescienceai/medmcqa
    revision: main
    splits:
      train: train
      validation: validation
  medqa:
    # The official jind11 repository distributes data through Google Drive rather
    # than GitHub. This HF distribution preserves the original source fields and splits.
    id: jind11/MedQA
    distribution_id: awinml/medqa
    config_name: questions
    revision: main
    splits:
      train: train
      dev: validation
      test: test
  mmlu_pro:
    id: TIGER-Lab/MMLU-Pro
    revision: main
    splits:
      test: test
    category: health

samples:
  sft_train: 12000
  sft_dev: 512
  medmcqa_eval: 1000
  initial_scan: 1000
  scan_expand_step: 500

lengths:
  explanation_max_tokens: 160
  sft_max_tokens: 1024
  frozen_max_completion_length: 256

tokenizer:
  name_or_path: Qwen/Qwen3-8B-Base
  revision: 49e3418fbbbca6ecbdf9608b4d22e5a407081db4
  trust_remote_code: false

output_dir: data/processed
